// [plugins] section {{{
plugins {
	// to use the 'api' keyword in dependencies
	id 'java-library'
	// Groovy support for Spock tests only
	id 'groovy'
	// awesome git tag / gradle version integration
	id 'pl.allegro.tech.build.axion-release' version '1.14.5'
	// publish on a maven-compatible repository
	id 'maven-publish'
}
// }}}

scmVersion {
	tag {
		prefix = 'v'
	}
}

allprojects {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

java {
	withSourcesJar()
}

tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

// [general] configuration
project.with { // {{{
	//project.name is set in the settings.gradle with rootProject.name
	group 'it.italiaonline.rnd.filters'
	version scmVersion.version
	description 'This filter "Titlelize" Italian text'
} // }}}

repositories { // {{{
	mavenCentral()
} // }}}


dependencies { // {{{
	implementation (
		// Jaro-Winkler similarity for conditional capitalization
		'org.apache.commons:commons-text:1.11.0'
	)

	testImplementation (
		'org.apache.groovy:groovy:4.0.30',
		// We use the awesome Spock testing and specification framework
		"org.spockframework:spock-core:2.3-groovy-4.0"
	)
} // }}}

// [publishing] configuration {{{
publishing {
	publications {
		mavenJava(MavenPublication) {
			groupId = 'com.github.grational'
			artifactId = 'smart-cap'
			version = scmVersion.version
			from components.java
		}
	}
}
// }}}

// use parallelization for tests
tasks.withType(Test) {
	useJUnitPlatform()
	maxParallelForks = Math.max(1, Runtime.runtime.availableProcessors().intdiv(2))
	if (project.hasProperty('testJavaHome')) {
		executable = "${project.property('testJavaHome')}/bin/java"
	}
}

tasks.register('javaCompatibilityTest', JavaExec) {
	description = 'Run Java consumer checks using production dependencies only.'
	group = 'verification'
	dependsOn testClasses
	classpath = sourceSets.test.output + sourceSets.main.runtimeClasspath
	mainClass = 'it.italiaonline.rnd.filters.JavaCompatibilityCheck'
	if (project.hasProperty('testJavaHome')) {
		executable = "${project.property('testJavaHome')}/bin/java"
	}
}

check.dependsOn javaCompatibilityTest
task uniTest(type: Test) {
	description = 'unit tests task'
	exclude '**/*ISpec*'
	exclude '**/*FSpec*'
}
task intTest(type: Test) {
	description = 'integration tests task'
	exclude '**/*USpec*'
	exclude '**/*FSpec*'
}
task funTest(type: Test) {
	description = 'functional tests task'
	exclude '**/*USpec*'
	exclude '**/*ISpec*'
}
gradle.startParameter.excludedTaskNames += "uniTest"
gradle.startParameter.excludedTaskNames += "intTest"
gradle.startParameter.excludedTaskNames += "funTest"

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
	options.release = 8
}
